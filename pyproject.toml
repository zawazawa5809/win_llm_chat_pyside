[project]
name = "win-llm-chat-pyside"
version = "0.1.0"
description = "Lightweight PySide6 LLM chat client for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.31.0",
]

[project.scripts]
llm-chat-client = "win_llm_chat_pyside.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/win_llm_chat_pyside"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

