[project]
name = "win-llm-chat-pyside"
version = "0.1.0"
description = "Lightweight PySide6 LLM chat client for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.31.0",
    "pypdf>=4.3.1",
]

[project.scripts]
llm-chat-client = "win_llm_chat_pyside.core.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/win_llm_chat_pyside"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0.20241016",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
namespace_packages = true
exclude = [
    "build",
    ".venv",
    "src/win_llm_chat_pyside/ui_main.py",
    "src/win_llm_chat_pyside/window_controller.py",
    "src/win_llm_chat_pyside/.*widgets.py",
    "src/win_llm_chat_pyside/.*dialogs.py",
    "src/win_llm_chat_pyside/role_profile_dialog.py",
    "src/win_llm_chat_pyside/prompt_template_dialog.py",
]

